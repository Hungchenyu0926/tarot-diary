<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔羅日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141228; --bg2:#1d1a38; --panel:#221f42; --line:#3a3566;
  --text:#ece8f7; --muted:#a9a3c8; --gold:#d8b46a; --gold2:#f1d9a0; --rev:#e0897a;
  --cw:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,#262150 0%,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--text);
  font:16px/1.75 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:600;line-height:1.3}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{text-align:center;padding:12px 0 4px}
header h1{margin:0;font-size:1.7rem;color:var(--gold2);letter-spacing:.15em}
header .date{color:var(--muted);font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0}
button,select{font:inherit;font-size:.92rem;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button.primary{background:var(--gold);color:#1b1730;border-color:var(--gold);font-weight:500}
button:disabled{opacity:.4;cursor:default}
.status{text-align:center;color:var(--gold2);min-height:1.75em;margin:4px 0}

/* 牌陣：身心靈 + 底牌 */
.spread{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:16px;justify-content:center;align-items:end;max-width:720px;margin:8px auto 4px}
.slot{text-align:center}
.slot .lbl{font-family:"Noto Serif TC",serif;color:var(--gold2);font-size:1.05rem}
.slot .lbl small{display:block;color:var(--muted);font-family:inherit;font-size:.75rem}
.slot.bottom{padding-left:16px;border-left:1px dashed var(--line)}
.place{width:clamp(78px,17vw,130px);aspect-ratio:350/600;margin:6px auto 0;border:1px dashed var(--line);border-radius:10px;perspective:800px}
.slot.next .place{border-color:var(--gold);box-shadow:0 0 18px rgba(216,180,106,.35)}
.flip{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden}
.flip .front{transform:rotateY(180deg);background:#fff}
.flip .front img{width:100%;height:100%;object-fit:cover;display:block}
.flip .front.rev img{transform:rotate(180deg)}
.slot .cname{font-size:.85rem;margin-top:4px;min-height:1.6em}
.tag{display:inline-block;font-size:.72rem;border-radius:4px;padding:0 6px;margin-left:4px;border:1px solid var(--gold);color:var(--gold2)}
.tag.rev{border-color:var(--rev);color:var(--rev)}

/* 牌背 */
.back{background:
  radial-gradient(circle at 50% 50%,var(--gold) 0 7%,transparent 8% 22%,var(--gold) 23% 24%,transparent 25%),
  repeating-conic-gradient(from 0deg at 50% 50%,#2c2766 0 15deg,#211d4d 15deg 30deg);
  border:2px solid var(--gold);border-radius:inherit;box-shadow:inset 0 0 0 3px #1b1838}

/* 78 張扇形牌陣 */
.deck{position:relative;margin:18px auto 8px;user-select:none}
.deck .card{position:absolute;width:var(--cw);aspect-ratio:350/600;border-radius:6px;cursor:pointer;
  transform-origin:50% 120%;transition:transform .6s,opacity .4s,top .6s,left .6s;box-shadow:-2px 2px 6px rgba(0,0,0,.45)}
.deck.stack .card{pointer-events:none;transform-origin:50% 50%}
.fly{position:fixed;z-index:1000;border-radius:6px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.flip.on .front{box-shadow:0 0 22px rgba(241,217,160,.45)}
@media (prefers-reduced-motion:reduce){.deck .card,.flip{transition:none}}

/* 模式切換 */
.modes{display:inline-flex;margin-top:10px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg2)}
.modes button{border:0;border-radius:999px;background:none;padding:5px 16px;color:var(--muted)}
.modes button.on{background:var(--gold);color:#1b1730;font-weight:500}

/* 天地人問事 */
.ask-q{max-width:720px;margin:6px auto 0}
.ask-q label{display:block;font-family:"Noto Serif TC",serif;color:var(--gold2);margin-bottom:4px}
.ask-q .model{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.6}
.pile{position:relative;margin:4px auto 0;text-align:center}
.pile .plbl{font-family:"Noto Serif TC",serif;color:var(--gold2);font-size:.95rem}
.pile .plbl small{color:var(--muted);font-family:inherit;font-size:.75rem;margin-left:6px}
.pile .deck{margin:2px auto 6px}
.pile.wait{opacity:.35}
.pile.done .deck{opacity:.25}
.pile.wait .deck .card,.pile.done .deck .card{pointer-events:none}
.pile.now .plbl{text-shadow:0 0 12px rgba(241,217,160,.7)}
.spread.ask3{grid-template-columns:repeat(3,1fr)}

/* 78 張牌義 */
#studySel{max-width:100%;min-width:260px}
#studyCard{max-width:780px;margin:12px auto 0}
.study-top{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.study-top img{width:150px;border-radius:8px;display:block;transition:transform .5s}
.study-top img.rev{transform:rotate(180deg)}
.study-top h2{margin:0 0 4px;color:var(--gold2);font-size:1.4rem}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:10px 0}
.sec summary{font-size:1rem}
table.kv{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
table.kv th{width:6.5em;text-align:left;vertical-align:top;color:var(--muted);font-weight:400;padding:6px 8px 6px 0;white-space:nowrap}
table.kv td{padding:6px 0;border-bottom:1px solid var(--line);line-height:1.7}
@media (max-width:640px){
  .study-top{grid-template-columns:100px 1fr;gap:12px;padding:12px}
  .study-top img{width:100px}
  table.kv th{width:5em}
}
.deck .card:hover,.deck .card:focus-visible{outline:none;z-index:200!important;top:calc(var(--y) - 14px)!important}
.deck .card.gone{opacity:0;pointer-events:none}
.deck.locked .card{cursor:default}
.deck.locked .card:hover{top:var(--y)!important}

/* 解讀與日記 */
.reading{display:none;max-width:780px;margin:24px auto 0}
.reading.show{display:block}
.pos{display:grid;grid-template-columns:96px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.pos img{width:96px;border-radius:6px;display:block}
.pos img.rev{transform:rotate(180deg)}
.pos h3{margin:0 0 2px;font-size:1.15rem;color:var(--gold2)}
.pos .kw{color:var(--muted);font-size:.9rem}
.pos .say{margin:8px 0}
details{margin:6px 0;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--gold);font-size:.92rem}
details table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
details th,details td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
details th{color:var(--muted);font-weight:400;white-space:nowrap}
details tr.hit td{background:rgba(216,180,106,.12)}
textarea{width:100%;min-height:72px;font:inherit;font-size:.95rem;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
textarea::placeholder{color:var(--muted);opacity:.6}
.note-lbl{font-size:.85rem;color:var(--muted);margin-top:8px}
.body-map{font-size:.85rem;color:var(--gold2);margin-top:4px;line-height:1.6}
.story{font-size:.88rem;line-height:1.6}
.story-btn{font-size:.78rem;padding:2px 10px;margin:4px 0 6px}
.guide{background:linear-gradient(180deg,#2a2552,var(--panel));border:1px solid var(--gold);border-radius:12px;padding:16px 20px}
.guide h2{margin:0 0 8px;color:var(--gold2);font-size:1.25rem}
.guide p{margin:.5em 0}
.guide .focus{border-left:3px solid var(--gold);padding-left:12px;color:var(--gold2)}
.guide h4{margin:14px 0 4px;color:var(--gold2);font-family:"Noto Serif TC",serif;font-weight:600}
.guide .free{color:var(--muted);font-size:.88rem}
.lens{font-size:.78rem;color:var(--muted);margin:2px 0 4px;line-height:1.6}
/* 牌陣占卜 */
.spread.multi{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));max-width:780px}
.spread.multi .place{width:100%;max-width:112px}
#spSel{max-width:100%}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin:28px 0 12px}
.foot a{color:var(--muted)}

@media (max-width:640px){
  .wrap{padding:12px 16px}
  header h1{font-size:1.35rem}
  .modes button{padding:4px 9px;font-size:.82rem}
  .spread.multi{grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}
  .spread{grid-template-columns:repeat(4,1fr);gap:6px}
  .slot.bottom{padding-left:6px}
  .slot .lbl small{font-size:.62rem;line-height:1.3}
  .slot .cname{font-size:.75rem}
  .place{width:100%;max-width:88px}
  .pos{grid-template-columns:64px 1fr;gap:12px;padding:12px}
  .pos img{width:64px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>塔羅日記</h1>
    <div class="date" id="date"></div>
    <nav class="modes" aria-label="模式">
      <button data-mode="diary" class="on">身心靈日記</button><button data-mode="ask">天地人問事</button><button data-mode="spread">牌陣占卜</button><button data-mode="study">78 張牌義</button>
    </nav>
  </header>

<section id="modeDiary">
  <div class="toolbar">
    <button id="btnShuffle">重新洗牌</button>
    <button id="btnBottom" class="primary" disabled>抽出底牌</button>
    <button id="btnReveal" class="primary">翻開四張牌</button>
    <button id="btnRedraw">↻ 重新抽牌</button>
    <select id="history" aria-label="歷史紀錄"></select>
  </div>
  <div class="status" id="status"></div>

  <div class="deck stack" id="deck" aria-label="78 張牌"></div>
  <div class="spread" id="spread"></div>

  <section class="reading" id="reading">
    <div id="positions"></div>
    <div class="guide" id="guide"></div>
    <div class="pos" style="display:block">
      <h3>今日心得</h3>
      <textarea id="overall" placeholder="把三張牌和底牌放在一起看，今天想對自己說什麼？"></textarea>
    </div>
    <div class="toolbar">
      <button id="btnExport" class="primary">存到 HUNG_NOTE 每日紀錄</button>
      <button id="btnCopy">複製 Markdown</button>
      <button id="btnRestart">↻ 重新抽牌</button>
    </div>
    <div class="status" id="saveMsg"></div>
  </section>
</section>

<section id="modeAsk" hidden>
  <div class="ask-q">
    <label for="askQ">想問的事</label>
    <textarea id="askQ" placeholder="先把問題寫清楚，例如：我該接下這份新工作嗎？"></textarea>
    <div class="model">天（大牌 22 張）＝天氣／路況廣播（Why）・人（宮廷牌 16 張）＝駕駛員（Who）・地（數字牌 40 張）＝車子／當下路程（What）</div>
  </div>
  <div class="toolbar">
    <button id="askShuffle" class="primary">洗牌</button>
    <button id="askReveal" class="primary" hidden>翻開三張牌</button>
    <button id="askRedraw" hidden>↻ 重新問事</button>
  </div>
  <div class="status" id="askStatus"></div>
  <div id="askPiles"></div>
  <div class="spread ask3" id="askSpread"></div>
  <section class="reading" id="askReading">
    <div id="askPositions"></div>
    <div class="guide" id="askGuide"></div>
    <div class="pos" style="display:block">
      <h3>我的結論</h3>
      <textarea id="askOverall" placeholder="看完天、人、地，這件事你打算怎麼做？"></textarea>
    </div>
    <div class="toolbar">
      <button id="askExport" class="primary">存到 HUNG_NOTE 每日紀錄</button>
      <button id="askCopy">複製 Markdown</button>
    </div>
    <div class="status" id="askMsg"></div>
  </section>
</section>

<section id="modeSpread" hidden>
  <div class="ask-q">
    <label for="spQ">想問的事（可空白，當作今日指引）</label>
    <textarea id="spQ" placeholder="例如：這個月的工作重心該放在哪？"></textarea>
  </div>
  <div class="toolbar">
    <select id="spSel" aria-label="選牌陣"></select>
    <button id="spShuffle" class="primary">洗牌</button>
    <button id="spReveal" class="primary" hidden>翻開所有牌</button>
    <button id="spRedraw" hidden>↻ 重新抽牌</button>
  </div>
  <div class="status" id="spStatus"></div>
  <div class="deck stack" id="spDeck" aria-label="78 張牌"></div>
  <div class="spread multi" id="spSpread"></div>
  <section class="reading" id="spReading">
    <div id="spPositions"></div>
    <div class="guide" id="spGuide"></div>
    <div class="pos" style="display:block">
      <h3>我的結論</h3>
      <textarea id="spOverall" placeholder="看完整個牌陣，你打算怎麼做？"></textarea>
    </div>
    <div class="toolbar">
      <button id="spExport" class="primary">存到 HUNG_NOTE 每日紀錄</button>
      <button id="spCopy">複製 Markdown</button>
    </div>
    <div class="status" id="spMsg"></div>
  </section>
</section>

<section id="modeStudy" hidden>
  <div class="toolbar">
    <select id="studySel" aria-label="選一張牌"></select>
  </div>
  <div class="toolbar">
    <button id="studyPrev">‹ 上一張</button>
    <button id="studyRand" class="primary">🎲 隨機</button>
    <button id="studyFlip">正／逆</button>
    <button id="studyNext">下一張 ›</button>
  </div>
  <div id="studyCard"></div>
</section>

  <div class="foot">牌面：Rider-Waite-Smith 1909 原版（Pamela Colman Smith，公有領域），掃描檔取自
    <a href="https://github.com/metabismuth/tarot-json">metabismuth/tarot-json</a>（MIT）。<br>寫到一半的筆記會先暫存在這台裝置的瀏覽器裡；按「存到 HUNG_NOTE 每日紀錄」才會寫進知識庫。</div>
</div>

<script src="cards.js"></script>
<script src="relations.js"></script>
<script>
const POS = [
  {key:'body',   name:'身', hint:'身體・行動・日常'},
  {key:'mind',   name:'心', hint:'情緒・想法・關係'},
  {key:'spirit', name:'靈', hint:'成長・信念・課題'},
];
const BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);
const today = new Date().toLocaleDateString('sv');   // 本地日期 YYYY-MM-DD

// ---- 儲存（每天一筆，存在瀏覽器） ----
const KEY = d => 'tarot:' + d;
function load(d){ try{ return JSON.parse(localStorage.getItem(KEY(d))) }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY(state.date), JSON.stringify(state)) }catch(e){} }

let state, busy = false, lastRowStart = 0;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, calm ? 0 : ms));
function fresh(){
  const ids = CARDS.map(c => c.id), r = new Uint32Array(ids.length * 2);
  crypto.getRandomValues(r);
  for (let i = ids.length - 1; i > 0; i--){ const j = r[i] % (i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  // 每張牌洗牌時就決定正逆位（各一半機率）
  return {date: today, deck: ids.map((id, i) => ({id, rev: r[ids.length + i] % 2 === 1})),
          started: false, picks: [], bottom: null, revealed: false, notes: {}};
}

// ---- 牌陣 ----
function buildSpread(){
  const slots = POS.map((p, i) => `<div class="slot" data-i="${i}"><div class="lbl">${p.name}<small>${p.hint}</small></div>
    <div class="place"></div><div class="cname"></div></div>`).join('');
  $('spread').innerHTML = slots + `<div class="slot bottom" data-i="3"><div class="lbl">底牌<small>潛在的課題</small></div>
    <div class="place"></div><div class="cname"></div></div>`;
}
const slotEl = i => $('spread').querySelector(`.slot[data-i="${i}"]`);
function fillSlot(i, pick){                       // 先蓋著放進牌位，翻牌由 reveal() 負責
  const c = BY_ID[pick.id];
  slotEl(i).querySelector('.place').innerHTML = `<div class="flip ${state.revealed ? 'on' : ''}"><div class="back"></div>
    <div class="front ${pick.rev ? 'rev' : ''}"><img src="cards/${c.id}.jpg" alt="${c.name}"></div></div>`;
  if (state.revealed) nameSlot(i, pick);
}
function nameSlot(i, pick){
  slotEl(i).querySelector('.cname').innerHTML = `${BY_ID[pick.id].name}<span class="tag ${pick.rev ? 'rev' : ''}">${pick.rev ? '逆' : '正'}</span>`;
}

function layoutDeck(deck = $('deck')){
  const W = deck.parentElement.clientWidth - 32;
  const rows = W < 560 ? 3 : W < 900 ? 2 : 1;
  const cw = W < 560 ? 40 : W < 900 ? 52 : 60, ch = cw * 600 / 350;
  const per = Math.ceil(78 / rows), lift = rows === 1 ? 46 : 26, rowH = ch + lift * .5 + 22;
  const H = Math.max(rows * rowH + 20, ch * 1.6 + 40), stacked = deck.classList.contains('stack');
  if (deck.id === 'deck') lastRowStart = (rows - 1) * per;
  deck.style.width = W + 'px'; deck.style.height = H + 'px';
  deck.style.setProperty('--cw', cw + 'px');
  [...deck.children].forEach((el, i) => {
    let x, y, tf;
    if (stacked){                                  // 收成一疊放中間
      x = (W - cw) / 2; y = (H - ch) / 2 - i * .2; tf = 'scale(1.6)';
    } else {                                       // 攤開成扇形
      const row = Math.floor(i / per), k = i % per, n = Math.min(per, 78 - row * per);
      const t = n > 1 ? k / (n - 1) : .5;          // 0..1 從左到右
      x = cw * .3 + t * (W - cw * 1.6); y = row * rowH + lift * 4 * (t - .5) ** 2 + 16;
      tf = `rotate(${(t - .5) * (rows === 1 ? 40 : 28)}deg)`;
    }
    el.style.left = x + 'px'; el.style.setProperty('--y', y + 'px'); el.style.top = y + 'px';
    el.style.transform = tf; el.style.zIndex = i;
  });
}
function buildDeck(){
  $('deck').classList.toggle('stack', !state.started);
  $('deck').innerHTML = state.deck.map((d, i) =>
    `<div class="card back" tabindex="0" role="button" aria-label="第 ${i + 1} 張牌" data-i="${i}"></div>`).join('');
  layoutDeck();
}

// 洗牌：收成一疊 → 左右交錯切洗三輪 → 一張張攤開成牌扇
async function shuffle(){
  if (busy) return;
  busy = true; state = fresh(); save();
  buildSpread(); $('reading').classList.remove('show');
  const deck = $('deck'); buildDeck(); refresh();
  $('status').textContent = '洗牌中……想著今天的自己';
  await wait(350);
  await riffle(deck, () => { state.started = true; save(); });
  busy = false; refresh();
}
// 一疊 78 張：交錯切洗三輪 → 攤開成牌扇（身心靈、牌陣占卜共用）
async function riffle(deck, done){
  const cards = [...deck.children], cw = cards[0].offsetWidth;
  for (const side of [1, -1, 1]){
    if (calm) break;
    await Promise.all(cards.slice(40).map((el, k) => el.animate([
      {transform: 'scale(1.6)'},
      {transform: `scale(1.6) translateX(${side * cw * .75}px) rotate(${side * 10}deg)`, offset: .45},
      {transform: 'scale(1.6)'}], {duration: 520, delay: k * 9, easing: 'ease-in-out'}).finished));
  }
  await wait(150);
  done();
  cards.forEach((el, i) => el.style.transitionDelay = (calm ? 0 : i * 12) + 'ms');
  deck.classList.remove('stack'); layoutDeck(deck);
  await wait(78 * 12 + 650);
  cards.forEach(el => el.style.transitionDelay = '');
}

// 被選中的牌從牌扇飛進牌位（仍是背面）
function fly(el, place){
  const a = el.getBoundingClientRect(), b = place.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  const dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay, s = b.width / w;
  const c = document.createElement('div'); c.className = 'back fly';
  Object.assign(c.style, {left: ax - w / 2 + 'px', top: ay - h / 2 + 'px', width: w + 'px', height: h + 'px'});
  document.body.appendChild(c);
  return c.animate([
    {transform: el.style.transform},
    {transform: `translate(${dx * .35}px, ${dy * .35 - 70}px) rotate(-6deg) scale(${(1 + s) / 2 * 1.15})`, offset: .4},
    {transform: `translate(${dx}px, ${dy}px) scale(${s})`}],
    {duration: calm ? 0 : 750, easing: 'cubic-bezier(.45,.05,.3,1)'}).finished.then(() => c.remove());
}

function taken(){ return new Set([...state.picks.map(p => p.id), state.bottom && state.bottom.id]) }
function refresh(){
  const n = state.picks.length, used = taken(), on = state.started;
  [...$('deck').children].forEach(el => el.classList.toggle('gone', used.has(state.deck[el.dataset.i].id)));
  $('deck').classList.toggle('locked', !on || n >= 3 || busy);
  $('spread').querySelectorAll('.slot').forEach(s => s.classList.toggle('next', on && !busy &&
    (n < 3 ? +s.dataset.i === n : !state.bottom && s.dataset.i === '3')));
  $('deck').style.display = state.bottom ? 'none' : '';
  $('btnShuffle').textContent = on ? '重新洗牌' : '洗牌';
  $('btnShuffle').classList.toggle('primary', !on);
  $('btnShuffle').disabled = busy || n > 0;
  $('btnShuffle').hidden = n > 0 || !!state.bottom;
  $('btnRedraw').hidden = !(n > 0 || state.bottom) || state.date !== today;   // 抽過牌才出現；回顧舊日期時不顯示
  $('btnRedraw').disabled = busy;
  $('btnBottom').hidden = !on || !!state.bottom;
  $('btnBottom').disabled = busy || n < 3;
  $('btnReveal').hidden = !state.bottom || state.revealed;
  $('btnReveal').disabled = busy;
  if (busy) return;
  $('status').textContent = !on ? '先深呼吸，想著今天的自己，準備好就按「洗牌」'
    : n < 3 ? `憑直覺從牌扇抽第 ${n + 1} 張：「${POS[n].name}」（${POS[n].hint}）`
    : !state.bottom ? '三張都抽好了，從牌堆最下面抽出底牌'
    : !state.revealed ? '四張牌都就位了，準備好就一起翻開'
    : '今天的牌陣完成了，先寫下自己的解讀，再展開牌義對照';
}

async function pick(i){
  if (busy || !state.started || state.picks.length >= 3 || state.bottom) return;
  const d = state.deck[i], el = $('deck').children[i];
  if (taken().has(d.id)) return;
  busy = true;
  const flight = fly(el, slotEl(state.picks.length).querySelector('.place'));
  state.picks.push(d); save(); refresh();
  await flight;
  fillSlot(state.picks.length - 1, d);
  busy = false; refresh();
}
async function drawBottom(){
  if (busy) return;
  const used = taken();
  // 畫面上最底下一排、最左邊、還沒被選走的那張（電腦只有一排，就是最左邊那張）
  const order = [...state.deck.keys()].slice(lastRowStart).concat([...state.deck.keys()].slice(0, lastRowStart));
  const i = order.find(k => !used.has(state.deck[k].id));
  busy = true; refresh();
  const el = $('deck').children[i];
  el.style.top = 'calc(var(--y) + 30px)';          // 先從牌堆底部抽出來一點
  await wait(400);
  const flight = fly(el, slotEl(3).querySelector('.place'));
  state.bottom = state.deck[i]; save();
  el.classList.add('gone');
  await flight;
  fillSlot(3, state.bottom);
  busy = false; refresh();
}
async function reveal(){
  if (busy) return;
  busy = true; state.revealed = true; save(); refresh();
  const all = [...state.picks, state.bottom];
  for (let i = 0; i < 4; i++){
    slotEl(i).querySelector('.flip').classList.add('on');
    await wait(450); nameSlot(i, all[i]); await wait(200);
  }
  busy = false; refresh();
  renderReading();
  await wait(500);
  $('reading').scrollIntoView({behavior: calm ? 'auto' : 'smooth'});
}

const EL = {

};
const FRIEND = {'火風':1,'風火':1,'水土':1,'土水':1};
const CLASH  = {'火水':1,'水火':1,'風土':1,'土風':1};
function relate(a, b){
  if (a === b) return `同屬${a}元素，彼此共振、力量加倍，也要留意${EL[a]}過了頭`;
  const k = a + b;
  if (FRIEND[k]) return `${a}與${b}互相助長，${EL[a]}能順勢帶動${EL[b]}`;
  if (CLASH[k])  return `${a}與${b}彼此拉扯，${EL[a]}和${EL[b]}可能各說各話，需要先找到平衡點`;
  if ((a + b).includes('火') && (a + b).includes('土')) return `火與土需要磨合，熱情要放進具體的步驟裡才會落地`;
  return `風與水互相牽動，想法容易被情緒帶著走，先分清楚「我想的」和「我感覺的」`;
}

function synth(picks, bottom){
  const cs = picks.map(p => BY_ID[p.id]), out = [];
  // 1. 大牌比重
  const maj = cs.map((c, i) => c.arcana === 'major' ? i : -1).filter(i => i >= 0);
  out.push([
    '今天三張都是小牌，功課落在日常細節裡，從小地方調整就會有感。',
    `唯一的大牌「${cs[maj[0]] && cs[maj[0]].name}」落在${maj.length && posOf(maj[0])}，是今天的主旋律，其他兩張都圍著它轉。`,
    `出現兩張大牌（${maj.map(posOf).join('、')}），今天有比較深的人生課題在發酵，值得多花點時間感受。`,
    '三張全是大牌，今天適合停下來，看看更大的方向，而不只是處理眼前的事。',
  ][maj.length]);
  if (maj.length) out.push(actLine(cs));
  // 2. 逆位
  const rv = picks.map((p, i) => p.rev ? i : -1).filter(i => i >= 0);
  out.push([
    '三張都是正位，身心靈的能量大致順暢，可以放心往外走。',
    `逆位落在${rv.length && posOf(rv[0])}，那裡是今天能量卡住、最需要溫柔照顧的地方。`,
    `${rv.map(posOf).join('、')}兩處逆位，能量偏向內收，先處理卡住的部分，再求前進。`,
    '三張都是逆位，今天的能量明顯向內，適合休息、整理、放慢，不必勉強自己衝刺。',
  ][rv.length]);
  // 3. 元素
  const els = cs.map(c => c.element), cnt = {};
  els.forEach(e => cnt[e] = (cnt[e] || 0) + 1);
  const top = Object.keys(cnt).find(e => cnt[e] >= 2);
  if (top) out.push(`${top}元素佔了 ${cnt[top]} 張，今天的重心在「${EL[top]}」。`);
  const miss = Object.keys(EL).filter(e => !cnt[e]);
  if (miss.length === 1) out.push(`缺少${miss[0]}元素，可以刻意補一點「${EL[miss[0]]}」，讓自己更完整。`);
  // 4. 牌間關係（身→心→靈有先後；底牌只看組合、鏡像、共振）
  const rel = relLines([...picks.map((p, i) => [POS[i].name, p]), ...(bottom ? [['底牌', bottom]] : [])], 3);
  const courts = cs.map((c, i) => isCourt(c) ? i : -1).filter(i => i >= 0);
  if (courts.length) out.push(`宮廷牌${courts.map(i => `「${cs[i].name}」`).join('、')}代表一種角色：可能是身邊的某個人，也可能是今天你可以練習扮演的態度。`);
  // 5. 底牌
  let tail = '';
  if (bottom){
    const b = BY_ID[bottom.id], same = els.map((e, i) => e === b.element ? i : -1).filter(i => i >= 0);
    tail = `底牌「${b.name}」（${bottom.rev ? '逆位' : '正位'}）藏在所有事情下面：${b[ori(bottom)].core}` +
      (same.length ? `它和${same.map(posOf).join('、')}同屬${b.element}元素，正在呼應那裡的訊息。` : '');
  }
  // 6. 今天的焦點
  const f = rv.length ? rv[0] : maj.length ? maj[0] : 0;
  const focus = `今天先照顧好${posOf(f)}：${cs[f][ori(picks[f])][POS[f].key]}`;
  return {paras: out, rel, tail, focus, ...closing(picks[f])};
}
const relHtml = rel => rel.length ? `<h4>🔗 牌間關係</h4>${rel.map(t => `<p>${t}</p>`).join('')}` : '';

function isoWeek(d){
  const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7);
  const w1 = new Date(t.getFullYear(), 0, 4);
  return `${t.getFullYear()}-W${String(1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7)).padStart(2, '0')}`;
}
const label = p => BY_ID[p.id].name + (p.rev ? '（逆）' : '');

    all.map((p, i) => `| ${names[i]} | ${BY_ID[p.id].name} | ${p.rev ? '逆位' : '正位'} | ${BY_ID[p.id][ori(p)].kw} |`).join('\n') + '\n\n---\n\n' +
    state.picks.map((p, i) => line(POS[i].name, p, POS[i].key, POS[i].key)).join('\n') + '\n' +

// 電腦（Chrome／Edge）：第一次選「30.每日紀錄」資料夾，之後直接寫入；手機：分享到雲端硬碟；都不行就下載
const idb = (mode, fn) => new Promise((ok, no) => {
  const r = indexedDB.open('tarot', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => { const q = fn(r.result.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => ok(q.result); q.onerror = no; };
  r.onerror = no;
});
async function folder(){
  let h = await idb('readonly', s => s.get('dir')).catch(() => null);
  if (h && (await h.queryPermission({mode: 'readwrite'}) === 'granted' || await h.requestPermission({mode: 'readwrite'}) === 'granted')) return h;
  alert('第一次使用：請在接下來的視窗選擇「G:\\我的雲端硬碟\\HUNG_NOTE\\30.每日紀錄」資料夾，之後就會自動存到那裡。');
  h = await showDirectoryPicker({id: 'tarot-diary', mode: 'readwrite'});
  await idb('readwrite', s => s.put(h, 'dir')).catch(() => {});
  return h;
}
// 兩種模式共用：存檔、複製
async function saveFile(name, text, msgId){
  const file = new File([text], name, {type: 'text/markdown'}), flash = msg => $(msgId).textContent = msg;
  try {
    if (window.showDirectoryPicker){
      const dir = await folder(), fh = await dir.getFileHandle(name, {create: true}), w = await fh.createWritable();
      await w.write(file); await w.close();
      return flash(`已存到「${dir.name}」：${name}`);
    }
    if (navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file], title: name});
      return flash('請在分享選單選「雲端硬碟」→ HUNG_NOTE／30.每日紀錄');
    }
  } catch(e){ if (e.name === 'AbortError') return flash('已取消'); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flash(`已下載 ${name}，請移到 HUNG_NOTE／30.每日紀錄`);
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); btn.textContent = '已複製 ✓'; }
  catch(e){ btn.textContent = '複製失敗，請改用存檔'; }
  setTimeout(() => btn.textContent = '複製 Markdown', 2000);
}

// ---- 歷史 ----
function buildHistory(){
  const days = [];
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith('tarot:')) days.push(k.slice(6)); } } catch(e){}
  if (!days.includes(today)) days.push(today);
  days.sort().reverse();
  $('history').innerHTML = days.map(d => `<option value="${d}" ${d === state.date ? 'selected' : ''}>${d === today ? '今天 ' + d : d}</option>`).join('');
}

function start(s){
  if (busy) return;
  state = s;
  if (state.started === undefined){ state.started = state.picks.length > 0; state.revealed = !!state.bottom; }  // 舊版紀錄
  $('date').textContent = state.date === today ? `今天 ${today}` : `回顧 ${state.date}`;
  $('reading').classList.remove('show');
  buildSpread(); buildDeck();
  state.picks.forEach((p, i) => fillSlot(i, p));
  if (state.bottom){ fillSlot(3, state.bottom); renderReading(); }
  refresh(); buildHistory();
}

$('deck').addEventListener('click', e => { const el = e.target.closest('.card'); if (el) pick(+el.dataset.i); });
$('deck').addEventListener('keydown', e => { const el = e.target.closest('.card');
  if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pick(+el.dataset.i); } });
$('btnShuffle').onclick = shuffle;
$('btnBottom').onclick = drawBottom;
$('btnReveal').onclick = reveal;
$('btnExport').onclick = () => saveFile(mdFile(), markdown(), 'saveMsg');
$('btnCopy').onclick = e => copyText(markdown(), e.target);
// 重新抽牌：清掉今天的牌與筆記，直接重新洗牌
function redraw(){
  if (busy || !confirm('確定要重新抽牌嗎？今天已抽的牌和寫的筆記都會清空。')) return;
  scrollTo({top: 0}); shuffle();
}
$('btnRedraw').onclick = $('btnRestart').onclick = redraw;
$('history').onchange = e => start(load(e.target.value) || fresh());
document.addEventListener('input', e => {
  const k = e.target.dataset.note || (e.target.id === 'overall' && 'overall');
  if (k){ state.notes[k] = e.target.value; save(); }
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layoutDeck(); askLayout(); spLayout(); }, 120); });

start(load(today) || fresh());
</script>
